<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="../../code/style.css">
<style>
/* review layout: sticky section nav left, one reading column ~70ch, figures may widen to 860px. Fonts and pens come from style.css. */
body{padding:0 16px 64px}
.shell{display:grid; grid-template-columns:220px minmax(0,1fr); gap:44px; max-width:1140px; margin:0 auto}
nav.toc{position:sticky; top:16px; align-self:start; max-height:calc(100vh - 32px); overflow:auto; padding:8px 0; font-size:.84rem}
nav.toc ol{list-style:none; padding:0; margin:.4rem 0 0}
nav.toc a{display:block; padding:.26rem .6rem; color:var(--ink-soft); text-decoration:none; border-left:2px solid transparent}
nav.toc a.active{color:var(--ink); border-left-color:var(--red)}
main{min-width:0; max-width:860px; padding-left:22px; border-left:1px solid var(--margin)}
@media (max-width:1000px){ .shell{display:block} nav.toc{display:none} main{padding-left:0; border-left:0} }
header.hero{padding:40px 0 10px; border-bottom:1px solid var(--rule); margin-bottom:8px}
.eyebrow{text-transform:uppercase; letter-spacing:.1em; font-size:.7rem; color:var(--ink-soft)}
.lead{font-size:1.02rem; max-width:64ch}
h2{font-size:1.25rem}
figure{margin:1.4rem 0; max-width:860px}
figure img{max-width:100%; height:auto; display:block; border:1px solid var(--rule); border-radius:4px; background:#fff}
figure.narrow{max-width:520px}
figcaption{font-size:.84rem; color:var(--ink-soft); margin-top:.4rem; max-width:80ch}
.note{border-left:3px solid var(--blue); padding:.6rem .9rem; margin:1rem 0; background:var(--paper-2); max-width:72ch}
.note.red{border-left-color:var(--red)} .note.green{border-left-color:var(--green)}
.cite{font-size:.8rem; color:var(--ink-soft)}
.cite a{color:var(--ink-soft)}
ol.refs{font-size:.86rem; padding-left:1.6rem} ol.refs li{margin:.35rem 0}
.tablewrap{overflow-x:auto; margin:1rem 0; border:1px solid var(--rule); border-radius:4px}
</style>
</head>
<body>
<div class="shell">
<nav class="toc" aria-label="Sections"><div class="eyebrow">Sections</div><ol id="toc"></ol></nav>
<main>
<header class="hero">
  <div class="eyebrow">review · {{DATE}} · {{N}} papers from lib</div>
  <h1>{{TITLE}}</h1>
  <p class="lead">{{LEAD}}</p>
</header>

<!-- sections: <section id="..."><h2>..</h2> ... </section>
     cite a paper inline as <span class="cite">[<a href="#ref-KEY">Author Year</a>]</span>
     one sentence to remember per section as <mark>..</mark>
     disagreement or caveat: <div class="note red">..</div>; replicated/confirmed: <div class="note green">..</div>
     figures: <figure><img src="figures/KEY_fig01.png" alt=".."><figcaption><b>Fig 1.</b> .. <span class="cite">[<a href="#ref-KEY">..</a>]</span></figcaption></figure> -->
{{SECTIONS}}

<section id="references">
<h2>References</h2>
<ol class="refs">
{{REFERENCES}}
</ol>
</section>
</main>
</div>
<script>
(function(){
  const toc=document.getElementById('toc'), secs=[...document.querySelectorAll('main section')];
  secs.forEach(s=>{ const h=s.querySelector('h2'); if(!h) return; const a=document.createElement('a'); a.href='#'+s.id; a.textContent=h.textContent; a.dataset.id=s.id; const li=document.createElement('li'); li.appendChild(a); toc.appendChild(li); });
  const links=[...toc.querySelectorAll('a')];
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) links.forEach(a=>a.classList.toggle('active', a.dataset.id===e.target.id)); }),{rootMargin:'-20% 0px -70% 0px'});
    secs.forEach(s=>io.observe(s));
  }
  try{ const p=JSON.parse(localStorage.getItem('lib:prefs')||'{}'); if(p.theme==='dark') document.documentElement.dataset.theme='dark'; if(p.font==='sans') document.documentElement.dataset.font='sans'; }catch(e){}
})();
</script>
</body>
</html>
